# Installed by SteamFrameDongleFix (steam-frame-dongle).
# Every MAC address change on an RTL8852CU forces an interface down/up. The chip
# then reinitializes over USB for 10-15 s while the kernel RTNL lock is held,
# which stalls every process that touches networking. Keep the permanent MAC.
[device-steam-frame-dongle]
match-device=driver:rtw89_8852cu
wifi.scan-rand-mac-address=no

[connection-steam-frame-dongle]
match-device=driver:rtw89_8852cu
wifi.cloned-mac-address=permanent
