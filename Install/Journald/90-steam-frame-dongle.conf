# Installed by SteamFrameDongleFix (steam-frame-dongle).
# The rtw89 driver logs about 20 kernel warnings per second (WARN_ON(!sband) in
# mac80211) while the dongle is idle. Give the journal room so that other logs
# survive longer than a few minutes. Remove when the kernel stops the warnings.
[Journal]
SystemMaxUse=1G
